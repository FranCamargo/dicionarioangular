<div class="busca">
  <svg class="busca__icone" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
    <path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
  </svg>
  <input
    type="text"
    class="busca__input"
    [placeholder]="placeholder()"
    [value]="valor()"
    (input)="atualizar($any($event.target).value)"
  />
  @if (valor()) {
    <button type="button" class="busca__limpar" (click)="limpar()" aria-label="Limpar busca">×</button>
  }
</div>
